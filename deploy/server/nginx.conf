server {
    listen 8080;
    client_max_body_size 100m;

    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;

    location = /_cvat_session {
        internal;
        proxy_pass http://127.0.0.1:18001/platform/internal/cvat-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $http_host;
        proxy_set_header X-Original-URI $request_uri;
    }

    location = /platform/internal/cvat-auth {
        return 404;
    }

    location /platform/ {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location = /auth/login {
        proxy_pass http://127.0.0.1:18081;
    }

    location = /api/auth/login {
        proxy_pass http://127.0.0.1:18080;
    }

    location /assets/ {
        auth_request /_cvat_session;
        proxy_pass http://127.0.0.1:18081;
    }

    location /api/ {
        auth_request /_cvat_session;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location /static/ {
        auth_request /_cvat_session;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $http_host;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location / {
        auth_request /_cvat_session;
        error_page 401 =302 /auth/login;
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}

server {
    listen 8008;
    location / { proxy_pass http://127.0.0.1:18083; }
}

server {
    listen 8081;
    location / { proxy_pass http://127.0.0.1:18082; }
}

server {
    listen 8082;
    location / { proxy_pass http://127.0.0.1:18084; }
}
