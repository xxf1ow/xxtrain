# https://beta.ruff.rs/docs/settings/
[tool.ruff]
# https://beta.ruff.rs/docs/rules/
line-length = 120
# Exclude a variety of commonly ignored directories.
respect-gitignore = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"
skip-magic-trailing-comma = true
docstring-code-format = true
