<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>现场标注台</title>
  <link rel="stylesheet" href="/platform/style.css">
  <script src="/platform/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="utility-header">
    <div class="brand-mark" aria-hidden="true">XX</div>
    <div>
      <p class="utility-label">现场标注工具</p>
      <p class="product-name">现场标注台</p>
    </div>
    <div id="session-tools" class="session-tools" hidden>
      <nav class="page-nav" aria-label="平台页面">
        <a aria-current="page" href="/platform/">现场工作区</a>
        <a href="/platform/training/">我的训练任务</a>
      </nav>
      <span id="session-user" class="session-user"></span>
      <button id="logout-button" class="text-button" type="button">退出登录</button>
    </div>
  </header>

  <main id="main-content">
    <section id="login-panel" class="login-panel" aria-labelledby="login-title">
      <div class="section-code" aria-hidden="true">WORKSPACE / ACCESS</div>
      <h1 id="login-title">登录后继续现场标注</h1>
      <p class="lede">使用分配给你的 CVAT 账号。平台只显示当前预置现场。</p>
      <form id="login-form" class="login-form" method="post" action="/platform/api/login">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-button" class="primary-button" type="submit">登录</button>
      </form>
      <p id="login-error" class="error-message" role="alert" hidden></p>
    </section>

    <section id="workspace-panel" class="workspace-panel" aria-labelledby="workspace-title" hidden>
      <div class="workspace-heading">
        <div>
          <p class="task-context">业务任务 <span id="task-name">—</span> <span aria-hidden="true">/</span> 现场</p>
          <h1 id="workspace-title"><span id="workspace-name">现场</span></h1>
        </div>
      </div>

      <p id="workspace-message" class="toast-message" role="status" aria-live="polite" hidden></p>

      <div class="upload-row">
        <dl class="workspace-facts">
          <div><dt>有效图片</dt><dd><span id="image-count">—</span> 张</dd></div>
        </dl>
        <div class="upload-picker">
          <label for="image-files" class="primary-button">上传图片</label>
          <input id="image-files" name="images" type="file" accept=".jpg,.jpeg,.png,.bmp" multiple>
        </div>
        <p id="upload-progress" class="operation-progress" role="status" aria-live="polite" hidden></p>
        <p id="upload-error" class="error-message operation-error" role="alert" hidden></p>
      </div>

      <div class="shared-data-label">
        <span>按当前任务规则完成各模型标注，训练可独立选择</span>
      </div>
      <div id="target-rail" class="target-rail" aria-label="模型目标"></div>

    </section>
  </main>
</body>
</html>
