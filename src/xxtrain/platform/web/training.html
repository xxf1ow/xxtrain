<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的训练任务</title>
  <link rel="stylesheet" href="/platform/style.css">
  <script src="/platform/training.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="utility-header">
    <div class="brand-mark" aria-hidden="true">XX</div>
    <div><p class="utility-label">模型训练</p><p class="product-name">训练任务</p></div>
    <nav class="page-nav" aria-label="平台页面">
      <a href="/platform/">现场工作区</a>
      <a aria-current="page" href="/platform/training/">我的训练任务</a>
    </nav>
  </header>
  <main id="main-content">
    <section id="training-panel" aria-labelledby="training-title">
      <p class="section-code">TRAINING / RUNS</p>
      <h1 id="training-title">我的训练任务</h1>
      <p class="lede">查看排队、训练和交付状态。任务状态来自训练服务的实时结果。</p>
      <p id="training-message" class="toast-message" role="status" aria-live="polite" hidden></p>
      <p id="training-error" class="error-message" role="alert" hidden></p>
      <div class="training-layout">
        <div id="training-list" class="training-list" aria-label="训练任务列表"></div>
        <article id="training-detail" class="training-detail" aria-live="polite">
          <p class="empty-state">选择一项任务查看进度和结果。</p>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
